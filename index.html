<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <!-- form: crea un formulario -->
        <form action="index.html" method="get">
        <!-- fieldset: agrupa elementos relacionados dentro de un formulario -->
        <fieldset>
            <!-- legend: título para el fieldset -->
            <legend>Datos personales by Andrea</legend>
            <!-- label: crea una etiqueta para un campo de entrada; for: asocia la etiqueta con el campo de entrada correspondiente -->
            <label for="nombre">Nombre:</label>
            <!-- input: crea un campo de entrada de texto; type="text": el campo de entrada permite insertar texto; id: identifica de manera única el campo de entrada; placeholder: muestra un texto de ayuda en el campo de entrada; required: especifica que el campo es obligatorio; autofocus: especifica que el campo debe tener el foco al cargar la página; size: especifica el ancho del campo; maxlength: especifica la longitud máxima de caracteres -->
            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required autofocus size="30" maxlength="40"><br><br>
            <label for="contraseña">Contraseña:</label>
            <!-- type="password": el campo de entrada permite insertar texto oculto; minlength: especifica la longitud mínima de caracteres -->
            <input type="password" id="contraseña" name="contraseña" minlength="8"><br><br>
            <label for="email">Correo electrónico:</label>
            <!-- type="email": el campo de entrada permite insertar direcciones de correo electrónico -->
            <input type="email" id="email" name="email" required><br><br>
            <label for="telefono">Teléfono:</label>
            <!-- type="tel": el campo de entrada permite insertar números de teléfono; pattern: especifica un patrón de validación -->
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}"><br><br>
            <label for="fecha">Fecha de nacimiento:</label>
            <!-- type="date": el campo de entrada permite insertar fechas -->
            <input type="date" id="fecha" name="fecha"><br><br>
            <label for="foto">Fotografía:</label>
            <!-- type="file": el campo de entrada permite seleccionar archivos -->
            <input type="file" id="foto" name="foto"><br><br>
            <label for="curso">Curso:</label>
            <!-- value: especifica el valor del campo; readonly: especifica que el campo es de solo lectura -->
            <input type="text" id="curso" name="curso" value="2026-2027" readonly><br><br>
            <label for="centro">Centro:</label>
            <!-- disabled: especifica que el campo está deshabilitado -->
            <input type="text" id="centro" name="centro" value="IES La Asunción" disabled><br><br>
        </fieldset>
        <fieldset>
            <legend>Preferencias</legend>
            <label for="turno">Turno:</label>
            <!-- type="radio": el campo de entrada permite seleccionar una opción de un grupo de opciones -->
            <input type="radio" id="turno" name="turno" value="mañana">
            <label for="turno">Mañana</label>
            <input type="radio" id="turno2" name="turno" value="tarde">
            <label for="turno2">Tarde</label><br><br>
            <label for="intereses">Intereses:</label>
            <!-- type="checkbox": el campo de entrada permite seleccionar varias opciones de un grupo de opciones -->
            <input type="checkbox" id="intereses" name="intereses" value="deporte">
            <label for="intereses">Deporte</label>
            <input type="checkbox" id="intereses2" name="intereses" value="musica">
            <label for="intereses2">Música</label>
            <input type="checkbox" id="intereses3" name="intereses" value="arte">
            <label for="intereses3">Arte</label><br><br>
            <label for="horas_estudio">Horas de estudio:</label>
            <!-- type="number": permite introducir números; min: especifica el valor mínimo; max: especifica el valor máximo; step: especifica el incremento de los valores -->
            <input type="number" id="horas_estudio" name="horas_estudio" min="0" max="10" step="2"><br><br>
            <label for="nivel">Nivel de estudios:</label>
            <!-- range: permite seleccionar un valor dentro de un rango -->
            <input type="range" id="nivel" name="nivel" min="1" max="10"><br><br>
            <label for="color">Color favorito:</label>
            <!-- type="color": permite seleccionar un color -->
            <input type="color" id="color" name="color"><br><br>
            <label for="hora">Hora:</label>
            <!-- type="time": permite seleccionar una hora -->
            <input type="time" id="hora" name="hora"><br><br>
            <label for="semana">Semana:</label>
            <!-- type="week": permite seleccionar una semana -->
            <input type="week" id="semana" name="semana"><br><br>
            <label for="mes">Mes:</label>
            <!-- type="month": permite seleccionar un mes -->
            <input type="month" id="mes" name="mes"><br><br>
            <label for="modulos">Módulos:</label>
            <!-- select: crea un menú desplegable; multiple: permite seleccionar varias opciones -->
            <select id="modulos" name="modulos" multiple>
                <!-- optgroup: agrupa opciones dentro del menú desplegable -->
                <optgroup label="Grado medio">
                    <!-- option: define una opción dentro del menú desplegable -->
                    <option value="modulo1">Sistemas Microinformáticos y Redes</option>
                </optgroup>
                <optgroup label="Grado superior">
                <!-- selected: especifica que la opción está seleccionada por defecto -->
                    <option value="modulo2" selected>Desarrollo de Aplicaciones Web</option>
                    <option value="modulo3">Desarrollo de Aplicaciones Multiplataforma</option>
                    <option value="modulo4">Administración de Sistemas Informáticos en Red</option>
                </optgroup>
            </select><br><br>
            <label for="comentarios">Comentarios:</label><br>
            <!-- textarea: crea un área de texto para comentarios; rows: especifica el número de filas visibles; cols: especifica el número de columnas visibles -->
            <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea><br><br>
        </fieldset>
        <!-- input type="submit": envía los datos del formulario -->
        <br><input type="submit" value="Enviar">
        <!-- type="reset": el botón restablece los valores del formulario -->
        <input type="reset" value="Restablecer">
        <!-- type="button": sirve para ejecutar acciones JavaScript -->
        <input type="button" value="Botón"><br><br>
        <!-- input type="image": botón con imagen que envía el formulario -->
        <input type="image" src="https://cdn-icons-png.flaticon.com/512/91/91848.png" alt="Enviar formulario" width="38" height="38"><br><br>
        <!-- button type="submit": envía los datos del formulario y permite contenido HTML adicional--> 
        <button type="submit">Enviar</button>
        <!-- button type="reset": restablece los valores del formulario y permite contenido HTML adicional -->
        <button type="reset">Restablecer</button>
        <!-- button type="button": sirve para ejecutar acciones JavaScript y permite contenido HTML adicional -->
        <button type="button">Botón</button><br><br>
    </form>
    <form action="https://es.wikipedia.org/w/index.php" method="get">
        <label for="search">Buscar en Wikipedia:</label>
       <!-- type="search": permite introducir términos de búsqueda; list: asocia el campo de entrada con una lista de opciones --> 
        <input type="search" id="search" name="search" list="sugerencias">
        <!-- datalist: define una lista de opciones para el campo de entrada -->
        <datalist id="sugerencias">
            <!-- option: define una opción dentro de la lista -->
            <option value="Formulario web">
            <option value="HTML">
            <option value="Protocolo de transferencia de hipertexto">
        </datalist>
        <input type="submit" value="Buscar">
    </form><br>
    <form action="https://www.openstreetmap.org/search" method="get">
        <select name="query">
            <optgroup label="Alicante">
                <option value="Alicante">Alicante</option>
                <option value="Elche">Elche</option>
            </optgroup>
            <optgroup label="Valencia">
                <option value="Valencia">Valencia</option>
                <option value="Gandia">Gandia</option>
            </optgroup>
        </select>
        <input type="submit" value="Buscar">
    </form><br>
    <form action="https://validator.w3.org/nu/" method="get">
        <label for="url">Validar HTML:</label>
        <input type="url" name="doc" value="https://xanmyx.github.io/TAREA-1.9/">
        <input type="checkbox" name="showsource" value="yes"> Ver el código
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
